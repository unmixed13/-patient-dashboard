<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - ระบบเก็บข้อมูลผู้ป่วยรายเดือน</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width:420px;">
    <h1>เข้าสู่ระบบ</h1>
    <label for="password">รหัสผ่าน</label>
    <input type="password" id="password" placeholder="กรอกรหัสผ่าน">
    <button id="loginBtn">เข้าสู่ระบบ</button>
    <div id="msg" class="msg"></div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginBtn').addEventListener('click', function () {
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('loginBtn');

      if (!password) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'กรุณากรอกรหัสผ่าน';
        return;
      }

      btn.disabled = true;
      msgEl.className = 'msg';
      msgEl.textContent = 'กำลังตรวจสอบ...';

      apiPost({ action: 'login', password: password })
        .then(function (res) {
          btn.disabled = false;
          if (res.success) {
            sessionStorage.setItem('token', res.token);
            window.location.href = 'form.html';
          } else {
            msgEl.className = 'msg error';
            msgEl.textContent = res.message || 'เข้าสู่ระบบไม่สำเร็จ';
          }
        })
        .catch(function (err) {
          btn.disabled = false;
          msgEl.className = 'msg error';
          msgEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
        });
    });

    // กด Enter เพื่อ login ได้
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
